name: aniworld
description: AniWorld Downloader — Android TV Client
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # HTTP
  dio: ^5.7.0
  # State management
  flutter_riverpod: ^2.6.1
  # Persistent settings (server URL)
  shared_preferences: ^2.3.4
  # Video playback — media_kit (libmpv-based, works on Android TV + Windows + all platforms)
  media_kit: ^1.1.11
  media_kit_video: ^1.1.2
  media_kit_libs_android_video: ^1.0.4
  media_kit_libs_windows_video: ^1.0.4
  # Image caching
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
