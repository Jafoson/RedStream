name: Android Screenshots

# Runs the Android app on an emulator against a demo backend
# (android/ci/demo_server.py) and takes screenshots of every screen.
on:
  push:
    paths:
      - 'android/ci/**'
      - '.github/workflows/android-screenshots.yml'
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install backend
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
          pip install -e . Pillow

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Start demo backend
        run: |
          mkdir -p "$RUNNER_TEMP/rshome"
          HOME="$RUNNER_TEMP/rshome" nohup python android/ci/demo_server.py "$RUNNER_TEMP/rsdemo" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8080/api/auth/check > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/api/cast/screens
          tail -20 "$RUNNER_TEMP/server.log"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RS_HOME: ${{ runner.temp }}/rshome
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: adb install -r android/app/build/outputs/apk/debug/app-debug.apk && python android/ci/drive.py shots

      - name: Screenshots into the log
        if: always()
        run: python android/ci/encode_shots.py shots

      - name: Server log
        if: always()
        run: tail -100 "$RUNNER_TEMP/server.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: shots/*.png
