name: Build & Release Flutter App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  # ── Android (arm64 + arm32) ───────────────────────────────────────────────
  build-android:
    name: Android APKs (arm64 + arm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build APKs (arm64 + arm32)
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64,android-arm --split-per-abi

      - name: Rename artifacts
        run: |
          mv app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             RedStream-v${{ inputs.version }}-android-arm64.apk
          mv app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             RedStream-v${{ inputs.version }}-android-arm32.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            RedStream-v${{ inputs.version }}-android-arm64.apk
            RedStream-v${{ inputs.version }}-android-arm32.apk

  # ── Windows ───────────────────────────────────────────────────────────────
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build Windows
        working-directory: app
        run: flutter build windows --release

      - name: Zip release folder
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "app\build\windows\x64\runner\Release\*" `
            -DestinationPath "RedStream-v${{ inputs.version }}-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: RedStream-v${{ inputs.version }}-windows-x64.zip

  # ── macOS ─────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build macOS
        working-directory: app
        run: flutter build macos --release

      - name: Zip .app bundle
        run: |
          cd app/build/macos/Build/Products/Release
          zip -r --symlinks \
            "${{ github.workspace }}/RedStream-v${{ inputs.version }}-macos.zip" \
            *.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: RedStream-v${{ inputs.version }}-macos.zip

  # ── GitHub Release ────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: RedStream v${{ inputs.version }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            artifacts/RedStream-v${{ inputs.version }}-android-arm64.apk
            artifacts/RedStream-v${{ inputs.version }}-android-arm32.apk
            artifacts/RedStream-v${{ inputs.version }}-windows-x64.zip
            artifacts/RedStream-v${{ inputs.version }}-macos.zip
